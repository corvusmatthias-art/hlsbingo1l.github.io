<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hlsbingo1L</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23111'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-weight='700' font-size='40' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&amp;family=Libre+Franklin:wght@400;500;600;700&amp;display=swap">
<style>
:root{
  --bg:#ffffff; --ink:#1a1a1b; --muted:#787c7e; --line:#d3d6da;
  --display:"Arvo","Rockwell","Roboto Slab",Georgia,serif;
  --ui:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121213; --ink:#d7dadc; --muted:#818384; --line:#3a3a3c; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.header{border-bottom:1px solid var(--line);padding:12px 16px 12px;text-align:center}
.wordmark{font-weight:600;font-size:12px;line-height:1;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}
.header h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,6.4vw,34px);line-height:1.15;letter-spacing:.005em;color:var(--ink);text-wrap:balance}

.tabs{display:flex;max-width:440px;margin:0 auto;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:14px 8px 11px;font:600 15px/1 var(--ui);letter-spacing:.01em;color:var(--muted);cursor:pointer;transition:color .15s}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.game{max-width:500px;margin:0 auto;padding:22px 16px 44px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;container-type:inline-size;perspective:800px}
.tile{position:relative;appearance:none;margin:0;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:600;font-size:clamp(10px,3.1cqw,14px);line-height:1.18;padding:6px 4px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;hyphens:auto;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transform-style:preserve-3d}
.tile.long{font-size:clamp(9px,2.6cqw,12px)}
.tile.xlong{font-size:clamp(8.5px,2.3cqw,11px)}
.tile.blank{cursor:default;color:var(--muted);font-weight:400}
.tile.marked{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tile.flip-in{animation:flipIn 220ms ease-in forwards}
.tile.flip-out{animation:flipOut 220ms ease-out forwards}
.tile.bounce{animation:bounce 1000ms ease-in-out}
.tile.deal{animation:pop 140ms ease-out both;animation-delay:calc(var(--i)*35ms)}
@keyframes flipIn{0%{transform:rotateX(0)}100%{transform:rotateX(-90deg)}}
@keyframes flipOut{0%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-30px)}50%{transform:translateY(5px)}60%{transform:translateY(-15px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}

.status{min-height:30px;margin:16px 0 6px;text-align:center;font-weight:700;font-size:19px;line-height:30px;letter-spacing:.03em;color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{appearance:none;margin:0;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:600 16px/1 var(--ui);letter-spacing:.01em;padding:0 24px;height:48px;min-width:150px;border-radius:100px;cursor:pointer;transition:transform .08s}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:active{transform:scale(.97)}
.hint{margin:22px 0 0;text-align:center;font-size:13px;line-height:1.5;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.tile{animation:none!important}.btn{transition:none}}
</style>
</head>
<body>
<header class="header"><div class="wordmark">hlsbingo1L</div><h1 id="title">Professor Sachs Bingo</h1></header>
<nav class="tabs" role="tablist" aria-label="Professors">
  <button type="button" class="tab" role="tab" id="tab-sachs" data-key="sachs" aria-selected="true" aria-controls="board">Sachs</button>
  <button type="button" class="tab" role="tab" id="tab-natapoff" data-key="natapoff" aria-selected="false" aria-controls="board">Natapoff</button>
</nav>
<main class="game">
  <div class="board" id="board" role="tabpanel" aria-labelledby="tab-sachs"></div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="actions">
    <button type="button" class="btn primary" id="randomise">Randomise</button>
    <button type="button" class="btn" id="clear">Clear marks</button>
  </div>
  <p class="hint">Tap a square when it happens. Four in a row is bingo.</p>
</main>
<script>
/* =====================================================================
   EDIT YOUR LISTS HERE.
   One square per line, in quotes, with a comma after each one.
   Each sheet deals sixteen at random (4 x 4), so keep at least sixteen per professor.
   ===================================================================== */
var LISTS = {
  sachs: {
    title: "Professor Sachs Bingo",
    items: [
      "Implies international law doesn’t exist due to lack of enforcement.",
      "“THE SUPREME COURT IS VERY WISE!”",
      "“You guys taking torts?”",
      "Asks an in-depth question about a skim item.",
      "Critiques Due Process for being too vague.",
      "Derides the nation-state of Kazakhstan.",
      "Yells into the microphone for comedic effect. “You’ll learn this in corporations WHICH YOU SHOULD ALL TAKE!”",
      "Fills 3 blackboards with indecipherable acronyms and badly drawn pictures of states.",
      "Refers to the French as the pinnacle of illegitimate alien authority.",
      "Only appears two minutes before the class begins.",
      "“Going over to our next computer-generated candidate”",
      "“Right… and…”",
      "Words a simple question like a riddle.",
      "Throws shade on a Supreme Court justice.",
      "Asking a leading question that doesn’t lead anywhere.",
      "“Good afternoon.”",
      "Pretends to casually name-drop a justice he knew.",
      "Wears a pin.",
      "Stands on his toes to reach the board.",
      "Self-impressed at a joke.",
      "Takes great joy from watching desperate students floundering through their notes.",
      "Can you read Section 4k?",
      "Ohio reference.",
      "Student wrongly quotes International Shoe.",
      "“PENNOYER!”"
    ]
  },
  natapoff: {
    title: "Professor Natapoff Bingo",
    items: [
      "Rips into 1st semester students after they make an educated guess.",
      "Cuts off a cold call answer after half a sentence.",
      "Casually mentions a violently depressing statistic about criminal law.",
      "Implies 1L students stressed about employment are insane.",
      "Warns about the consequences of arriving late.",
      "“Not quite.”",
      "The Natapose™.",
      "Communicates with hand gestures.",
      "“YOU DON’T KNOW, BUT YOU WILL LEARN.”",
      "Clasps hands together and nods.",
      "“Any old thing”",
      "Clears throat after mimicking the rationale of a crime.",
      "Sighs at a student’s question and asks another student to repeat their previous answer.",
      "“Rules first, facts second.”",
      "“You can CHOOSE.”",
      "Good morning.",
      "Threatens to reduce the 10-minute break.",
      "“I’m going to put that differently.”",
      "Randomly adopts a staccato speech pattern.",
      "“COMMIT!”",
      "“Hold on…” (in response to a reasonable question).",
      "“It’s on you to argue.”",
      "“ARE WE THERE?”",
      "“You just told me what the rule was.”",
      "Exhausted, “So…”",
      "Derides a memorised answer that’s right."
    ]
  }
};
/* ============================ end of lists ============================ */

(function () {
  'use strict';

  var ORDER = ['sachs', 'natapoff'];
  var SIZE = 4, CELLS = SIZE * SIZE;
  /* every row, column and the two diagonals */
  var LINES = (function () {
    var lines = [], r, c, d1 = [], d2 = [];
    for (r = 0; r < SIZE; r++) {
      var row = [], col = [];
      for (c = 0; c < SIZE; c++) { row.push(r * SIZE + c); col.push(c * SIZE + r); }
      lines.push(row, col);
      d1.push(r * SIZE + r); d2.push(r * SIZE + (SIZE - 1 - r));
    }
    lines.push(d1, d2);
    return lines;
  })();
  var KEY_SEL = 'profBingo:selected', KEY_SHEET = 'profBingo:sheet:';
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* storage, guarded: private windows and blocked storage must not break the page */
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function safeParse(s) { if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function rnd(n) {
    if (window.crypto && window.crypto.getRandomValues) { var a = new Uint32Array(1); window.crypto.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }
  function clean(arr) {
    var seen = {}, out = [];
    for (var i = 0; i < arr.length; i++) {
      var s = String(arr[i] == null ? '' : arr[i]).replace(/\s+/g, ' ').trim();
      if (!s) continue;
      var k = s.toLowerCase(); if (seen[k]) continue;
      seen[k] = true; out.push(s);
    }
    return out;
  }
  function sigOf(items) {
    var s = items.join('\n'), h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36) + ':' + items.length;
  }

  var els = {
    title: document.getElementById('title'),
    board: document.getElementById('board'),
    status: document.getElementById('status'),
    tabs: Array.prototype.slice.call(document.querySelectorAll('.tab')),
    randomise: document.getElementById('randomise'),
    clear: document.getElementById('clear')
  };
  var current, sheet;

  function itemsOf(key) { return clean(LISTS[key].items || []); }
  function makeSheet(key) {
    var pool = shuffle(itemsOf(key).slice()), cells = [], marks = [];
    for (var i = 0; i < CELLS; i++) { cells.push(i < pool.length ? pool[i] : null); marks.push(false); }
    return { cells: cells, marks: marks, sig: sigOf(itemsOf(key)) };
  }
  function loadSheet(key) {
    var raw = safeParse(lsGet(KEY_SHEET + key));
    if (raw && Array.isArray(raw.cells) && raw.cells.length === CELLS && Array.isArray(raw.marks) && raw.marks.length === CELLS) {
      var s = { cells: raw.cells.map(function (c) { return typeof c === 'string' ? c : null; }), marks: raw.marks.map(Boolean), sig: String(raw.sig || '') };
      var inPlay = s.marks.some(Boolean), hasCells = s.cells.some(function (c) { return c !== null; });
      /* keep a sheet that is in play; an untouched sheet is redealt if the list changed */
      if (hasCells && (inPlay || s.sig === sigOf(itemsOf(key)))) return s;
    }
    return makeSheet(key);
  }
  function saveSheet() { lsSet(KEY_SHEET + current, JSON.stringify(sheet)); }
  function winningLines() {
    return LINES.filter(function (l) { return l.every(function (i) { return sheet.cells[i] !== null && sheet.marks[i]; }); });
  }

  function renderBoard(deal) {
    els.board.innerHTML = sheet.cells.map(function (c, i) {
      if (c === null) return '<div class="tile blank" data-i="' + i + '" aria-hidden="true">—</div>';
      var cls = c.length > 80 ? ' xlong' : (c.length > 50 ? ' long' : '');
      var on = !!sheet.marks[i];
      return '<button type="button" class="tile' + cls + (on ? ' marked' : '') + (deal && !reduceMotion ? ' deal' : '') +
        '" data-i="' + i + '" style="--i:' + i + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + esc(c) + '</button>';
    }).join('');
    updateStatus();
  }
  function renderAll(deal) {
    els.title.textContent = LISTS[current].title;
    els.tabs.forEach(function (t) { t.setAttribute('aria-selected', t.getAttribute('data-key') === current ? 'true' : 'false'); });
    els.board.setAttribute('aria-labelledby', 'tab-' + current);
    renderBoard(deal);
  }
  function updateStatus() {
    var n = itemsOf(current).length;
    if (winningLines().length) els.status.textContent = 'Bingo!';
    else if (n < CELLS) els.status.textContent = n === 0 ? 'No squares in this list yet.' : 'Only ' + n + ' squares — add at least ' + CELLS + '.';
    else els.status.textContent = '';
  }
  function applyMark(tile, on) {
    tile.classList.toggle('marked', on);
    tile.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function celebrate(line) {
    line.forEach(function (idx, k) {
      var tile = els.board.children[idx]; if (!tile) return;
      setTimeout(function () {
        tile.classList.remove('bounce'); void tile.offsetWidth; tile.classList.add('bounce');
      }, k * 100);
    });
  }
  function toggle(tile, i) {
    var on = !sheet.marks[i];
    sheet.marks[i] = on; saveSheet();
    function finish() {
      updateStatus();
      if (on && !reduceMotion) {
        var line = winningLines().filter(function (l) { return l.indexOf(i) >= 0; })[0];
        if (line) celebrate(line);
      }
    }
    if (reduceMotion || tile.classList.contains('flip-in') || tile.classList.contains('flip-out')) { applyMark(tile, on); finish(); return; }
    tile.classList.remove('bounce', 'deal');
    tile.classList.add('flip-in');
    tile.addEventListener('animationend', function h1(e) {
      if (e.animationName !== 'flipIn') return;
      tile.removeEventListener('animationend', h1);
      applyMark(tile, on);
      tile.classList.remove('flip-in'); tile.classList.add('flip-out');
      tile.addEventListener('animationend', function h2(e2) {
        if (e2.animationName !== 'flipOut') return;
        tile.removeEventListener('animationend', h2);
        tile.classList.remove('flip-out');
        finish();
      });
    });
  }

  els.board.addEventListener('click', function (e) {
    var tile = e.target.closest('button.tile'); if (!tile) return;
    toggle(tile, +tile.getAttribute('data-i'));
  });
  els.board.addEventListener('animationend', function (e) {
    if (e.animationName === 'bounce') e.target.classList.remove('bounce');
    if (e.animationName === 'pop') e.target.classList.remove('deal');
  });
  els.randomise.addEventListener('click', function () {
    sheet = makeSheet(current); saveSheet(); renderBoard(true);
  });
  els.clear.addEventListener('click', function () {
    for (var i = 0; i < CELLS; i++) sheet.marks[i] = false;
    saveSheet();
    Array.prototype.forEach.call(els.board.querySelectorAll('button.tile'), function (t) { t.classList.remove('bounce', 'flip-in', 'flip-out'); applyMark(t, false); });
    updateStatus();
  });
  function select(key, focusTab) {
    if (!LISTS[key]) return;
    current = key; lsSet(KEY_SEL, key);
    sheet = loadSheet(key); saveSheet();
    renderAll(false);
    if (focusTab) document.getElementById('tab-' + key).focus();
  }
  els.tabs.forEach(function (t) {
    t.addEventListener('click', function () { select(t.getAttribute('data-key'), false); });
    t.addEventListener('keydown', function (e) {
      var i = ORDER.indexOf(current), j = null;
      if (e.key === 'ArrowRight') j = (i + 1) % ORDER.length;
      else if (e.key === 'ArrowLeft') j = (i - 1 + ORDER.length) % ORDER.length;
      else if (e.key === 'Home') j = 0;
      else if (e.key === 'End') j = ORDER.length - 1;
      if (j !== null) { e.preventDefault(); select(ORDER[j], true); }
    });
  });

  var saved = lsGet(KEY_SEL);
  select(LISTS[saved] ? saved : ORDER[0], false);
})();
</script>
</body>
</html>
